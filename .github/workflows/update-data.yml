name: update-data

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Collect feeds
        run: python3 scripts/fetch_data.py "$RUNNER_TEMP/data.json"

      - name: Commit to the data branch
        run: |
          if git fetch -q origin data && git show origin/data:data.json | cmp -s - "$RUNNER_TEMP/data.json"; then
            echo "data.json unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B data
          cp "$RUNNER_TEMP/data.json" data.json
          git add data.json
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin data
